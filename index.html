/* ===== project card buttons ===== */
.card .bt.pj b,.card .bt b{display:inline-block;transition:transform .25s;font-weight:700}
.card .bt.pj:hover b{transform:translateX(5px)}
.bd.pb{border-color:var(--c);color:#bff7ff;background:rgba(25,240,255,.08)}
/* ===== patents ===== */
.pats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.pat{position:relative;padding:22px 22px 20px;background:repeating-linear-gradient(-45deg,rgba(var(--pc),.04) 0 2px,transparent 2px 12px),linear-gradient(160deg,#0d1828,#0a1020 60%);border:1px solid rgba(var(--pc),.45);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));overflow:hidden;transition:transform .35s,box-shadow .35s;display:flex;flex-direction:column}
.pat:hover{transform:translateY(-6px);box-shadow:0 18px 40px -18px rgba(var(--pc),.6)}
.pat::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,rgb(var(--pc)),transparent);transform:scaleX(0);transform-origin:left;transition:transform 1s calc(var(--i)*.15s)}
.pat.in::before{transform:scaleX(1)}
.pat-top{display:flex;justify-content:space-between;align-items:center;font:500 12px 'JetBrains Mono',monospace;color:rgb(var(--pc));letter-spacing:.14em;text-transform:uppercase}
.pat-st{font:700 12px 'Chakra Petch',sans-serif;letter-spacing:.16em;border:2px double rgb(var(--pc));padding:2px 9px;transform:rotate(-8deg);color:rgb(var(--pc))}
.pat h3{font-size:18px;line-height:1.35;color:#fff;margin:14px 0 16px;flex:1}
.pat dl{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(var(--pc),.3);border:1px solid rgba(var(--pc),.3);margin-bottom:16px}
.pat dl div{background:rgba(8,13,24,.94);padding:8px 11px}
.pat dt{font:500 10.5px 'JetBrains Mono',monospace;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.pat dd{font:600 14px 'JetBrains Mono',monospace;color:#fff;margin-top:1px}
.pat .acts{margin-top:0}
.pat .bt.pj{border-color:rgb(var(--pc))}
.pat-seal{position:absolute;right:-34px;bottom:-34px;width:120px;height:120px;border-radius:50%;border:1px dashed rgba(var(--pc),.4);box-shadow:0 0 0 12px rgba(var(--pc),.04),0 0 0 24px rgba(var(--pc),.03);animation:ptspin 18s linear infinite;pointer-events:none}
@keyframes ptspin{to{transform:rotate(360deg)}}
/* ===== warp transition into a project page ===== */
#pjw{position:fixed;inset:0;z-index:200;pointer-events:none;visibility:hidden;--ac:25,240,255}
#pjw.on{visibility:visible;pointer-events:all}
#pjw canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3}
#pjw .bd{position:absolute;left:0;right:0;height:calc(100%/12 + 1px);background:#070b16;z-index:2;transition:transform .55s cubic-bezier(.77,0,.18,1)}
#pjw .bd:nth-child(4n+2){background:#0a1222}
#pjw .bd::after{content:"";position:absolute;top:0;bottom:0;width:3px;background:rgb(var(--ac));box-shadow:0 0 18px rgb(var(--ac))}
#pjw .bd:nth-child(even){transform:translateX(-102%)}#pjw .bd:nth-child(even)::after{left:0}
#pjw .bd:nth-child(odd){transform:translateX(102%)}#pjw .bd:nth-child(odd)::after{right:0}
#pjw.cl .bd{transform:none}
#pjw .ghost{position:fixed;z-index:4;object-fit:cover;transition:all .9s cubic-bezier(.7,0,.2,1);box-shadow:0 0 0 2px rgb(var(--ac)),0 0 60px rgba(var(--ac),.6);filter:saturate(1.3)}
#pjw.cl .ghost{opacity:0;filter:blur(6px) saturate(2)}
#pjw .hd{position:absolute;inset:0;z-index:5;display:grid;place-items:center;opacity:0;transition:opacity .3s .25s}
#pjw.cl .hd{opacity:1}
#pjw .hd>div{position:relative;text-align:center;width:min(640px,90vw)}
#pjw .hd svg{position:absolute;left:50%;top:50%;width:min(520px,92vw);height:min(520px,92vw);transform:translate(-50%,-50%);overflow:visible}
#pjw .hd svg circle{fill:none;stroke:rgb(var(--ac));transform-origin:50% 50%}
#pjw .hd svg .r1{stroke-dasharray:4 10;stroke-width:1.5;animation:pjr 3s linear infinite}
#pjw .hd svg .r2{stroke-dasharray:120 40 10 40;stroke-width:3;opacity:.7;animation:pjr 2s linear infinite reverse}
#pjw .hd svg .r3{stroke-dasharray:2 6;stroke-width:8;opacity:.25;animation:pjr 6s linear infinite}
@keyframes pjr{to{transform:rotate(360deg)}}
#pjw .hd em{display:block;font:500 13px 'JetBrains Mono',monospace;color:rgb(var(--ac));letter-spacing:.3em}
#pjw .hd b{display:block;font:700 clamp(32px,6.5vw,84px)/1.02 'Chakra Petch',sans-serif;color:#fff;text-shadow:0 0 30px rgb(var(--ac));margin:12px 0 16px;word-break:break-word}
#pjw .hd b.long{font-size:clamp(24px,3.6vw,44px)}
#pjw .pg{display:block;width:min(360px,70vw);height:3px;margin:0 auto;background:rgba(var(--ac),.2);position:relative}
#pjw .pg s{position:absolute;left:0;top:0;bottom:0;width:0;background:rgb(var(--ac));box-shadow:0 0 14px rgb(var(--ac))}
#pjw pre{font:12px/1.6 'JetBrains Mono',monospace;color:#bff7ff;text-align:left;width:min(360px,70vw);margin:16px auto 0;min-height:6.4em;white-space:pre-wrap}
#pjw pre i{color:rgb(var(--ac));font-style:normal}
#pjw .fl{position:absolute;inset:0;z-index:6;background:#fff;opacity:0;pointer-events:none}
#pjw.fx .fl{animation:pjfl .35s}
@keyframes pjfl{30%{opacity:.55}100%{opacity:0}}
.glt{animation:glt .38s steps(2) 1}
.glt .m img{animation:gltc .38s steps(3) 1}
@keyframes glt{0%{transform:translate(0)}20%{transform:translate(-6px,2px);filter:drop-shadow(4px 0 #ff3fd2) drop-shadow(-4px 0 #19f0ff)}40%{transform:translate(5px,-2px);clip-path:inset(10% 0 30% 0)}60%{transform:translate(-3px,1px);clip-path:inset(40% 0 5% 0)}80%{transform:translate(3px,0);filter:hue-rotate(90deg)}100%{transform:none;clip-path:none;filter:none}}
@keyframes gltc{33%{transform:scale(1.08) translateX(-4px);filter:hue-rotate(160deg) saturate(3)}66%{transform:scale(1.04) translateX(4px)}}

<noscript><main style="max-width:820px;margin:30px auto;padding:24px;background:#fff;color:#111;font-family:system-ui,sans-serif;line-height:1.6"><h1>Sayantan Panda</h1><p>Roboticist / Embedded System Developer. MS Mobile Robotics at the University of Bonn, Germany.</p><p>I’m the kind of person who loves taking things apart just to figure out how to put them back together—better, smarter, and sometimes cheaper. Whether it’s building gadgets from scratch or giving old ones a fresh twist with eco-friendly materials, I’m always up for a challenge. Robotics, embedded systems, AI—those are my playgrounds. And yeah, I’m a bit of a “last-minute engineer,” thriving on the adrenaline rush of turning wild ideas into reality just in time!</p><p>But life isn’t all circuits and code. I’m a gamer at heart, I hold a Master’s degree in Fine Art (robots and art coexist in my universe), and photography is my way of capturing the magic around me. I love cooking, especially when I’m experimenting in the kitchen like it’s another lab, and I’m always eager to meet new people, share stories and grow through connections.</p><p>Currently I am doing my MS in Mobile Robotics at the University of Bonn, with a focus on SLAM, navigation, localization and ROS 2.</p><h2>Projects</h2><ul><li><a href="projects/greenvault.html"><b>GreenVault: Solar-Powered, AI-Driven, IoT-Enabled Smart Storage for Sustainable Agriculture</b></a> (Sept 2024 – Nov 2024, SRMIST). Smart storage with IoT sensing, YOLOv8 spoilage detection, solar power and a mobile app. Patent published.</li><li><a href="projects/plugpal.html"><b>PlugPal</b></a> (Dec 2023 – present, SRMIST). Autonomous six-axis robotic arm for EV charging with YOLOv8 port detection and ROS 2 control.</li><li><a href="projects/emma.html"><b>EMMA: Enhanced Multitasking Medical Assistant</b></a> (since Feb 2024, SRMIST). Hospital assistant robot for registration, vital signs, chatbot and emergency alerts. Patent published.</li><li><a href="projects/avitron.html"><b>AViTRoN: Advanced Vision Track Routing and Navigation</b></a> (since Dec 2023, SRMIST). YOLOv8 charging-port detection and ROS navigation for EV charging robots.</li><li><a href="projects/gait-analysis.html"><b>Analyzing Gait Angle Variations in Healthy Individuals and Knee Osteoarthritis Patients Utilizing Non-invasive IMU Sensors</b></a> (SRMIST). Wearable IMU knee monitor with threshold alerts. Patent published.</li><li><a href="https://github.com/Sayantan001/multitasking-weather-robot"><b>Multi-Tasking and Weather Forecasting Robot using ATmega328P</b></a> (Oct 2022 – Feb 2023, SRMIST).</li><li><a href="https://github.com/Sayantan001/self-sorting-dustbin"><b>Self-Sorting Dustbin</b></a> (Sep 2022 – Jan 2023, SRMIST).</li></ul><h2>Experience</h2><ul><li><b>R&amp;D Engineer, Robotics and AI Trainer</b>, Reboot Robotics Academy | Aug 2025 – Aug 2026 | Kolkata, India</li><li><b>Research Intern</b>, National Institute of Ocean Technology (Ministry of Earth Sciences, Govt. of India) | Dec 2023 – Jan 2024 | Tamil Nadu, India</li><li><b>Undergraduate Researcher</b>, Centre for Wireless EV Charging Station, Department of EEE, SRMIST | Nov 2023 – Jun 2024 | India</li><li><b>Domain Lead, Embedded Systems</b>, iEMbotics Lab, Tech Park 1306A, SRMIST | Funded by the Naval Research Board, DRDO | Aug 2021 – Mar 2025 | India</li></ul><h2>Publications</h2><ul><li><a href="https://www.taylorfrancis.com/chapters/edit/10.1201/9781003768654-38/automation-healthcare-robotic-approach-patient-registration-vital-sign-tracking-chatbot-interaction-sayantan-panda-sankhadeep-dutta-gowtham-ammanamanchi-samiappan-dhanalakshmi">Automation in Healthcare: A Robotic Approach for Patient Registration, Vital Sign Tracking, and Chatbot Interaction</a>. Sayantan Panda, Sankhadeep Dutta, Gowtham Ammanamanchi, Samiappan Dhanalakshmi | Computing Communication and Intelligence, Taylor &amp; Francis, 2026 (book chapter)</li><li><a href="https://www.sciencedirect.com/science/article/pii/S2590123025015087">Integrated design and YOLO based control framework for autonomous EV charging robot platforms</a>. V.C. Mahaadevan, Narayanamoorthi R, ShanmugamPillai Pushparaj Logeshwer, Harshit Jain, Sayantan Panda, Petr Moldrik, Tomas Novak, Radomir Gono | Results in Engineering 26 (2025) 105438</li><li><a href="https://ieeexplore.ieee.org/abstract/document/10401234">AViTRoN: Advanced Vision Track Routing and Navigation for Autonomous Charging of Electric Vehicles</a>. V.C. Mahaadevan, Narayanamoorthi R, Sayantan Panda, Sankhaddep Dutta, Gerard Dooly (SRMIST, India; University of Limerick, Ireland)</li><li><a href="https://link.springer.com/chapter/10.1007/978-981-99-9562-2_35">Advanced Real-Time Monitoring System for Marine Net Pens: Integrating Sensors, GPRS, GPS, and IoT with Embedded Systems</a>. Sayantan Panda, Narayanamoorthi R, Samiappan Dhanalakshmi (SRMIST, India)</li><li><a href="https://link.springer.com/chapter/10.1007/978-981-97-8946-7_5">Analyzing Gait Angle Variations in Healthy Individuals and Knee Osteoarthritis Patients Utilizing Non-invasive IMU Sensors</a>. Madhavan Bharanidivya, Sayantan Panda, Samiappan Dhanalakshmi (SRMIST, India)</li><li><a href="https://ieeexplore.ieee.org/abstract/document/10990617">Integrating Intelligent Chatbots in Healthcare: AI Based Healthcare Chatbot</a>. Sushmit Singh Rathore, Rohit Ghosh, Sayantam Giri, Agniva Mukherjee, Priyanshu Raj, Sayantan Panda, S. Latha, Samiappan Dhanalakshmi (SRMIST, India)</li></ul><h2>Patents</h2><ul><li>A System and Method For Multitasking Medical Assistance. Published, publication no. 52/2024 (27/12/2024), application no. 202441066981 (filed 04/09/2024).</li><li>A Storage System For Agricultural Produce And A Method Thereof. Published, publication no. 12/2025 (21/03/2025), application no. 202541019684 (filed 05/03/2025).</li><li>Analysing Gait Angle Variations in Healthy Individuals and Knee Osteoarthritis Patients Utilizing Non-Invasive IMU Sensors. Published, publication no. 17/2025 (25/04/2025), application no. 202541027916 (filed 25/03/2025).</li></ul><h2>Education</h2><ul><li><b>Master of Science, Mobile Robotics</b>, University of Bonn, Germany | In progress</li><li><b>Bachelor of Technology, Electronics and Communication Engineering</b>, S.R.M Institute of Science and Technology | CGPA 9.61 / 10 | May 2025</li><li><b>Higher Secondary, Pure Science</b>, Pathfinder Higher Secondary Public School | 72%</li><li><b>Secondary</b>, Belda Gangadhar Academy | 92%</li></ul><h2>Skills</h2><ul><li><b>Programming:</b> C, C++, Python</li><li><b>Robotics and AI:</b> ROS / ROS 2, YOLOv8, Jetson Nano</li><li><b>Computer-Aided Design:</b> AutoCAD, Fusion 360</li><li><b>Circuit Simulation and Design:</b> LTspice, PSpice, PCB design</li><li><b>FPGA Design:</b> Altera Quartus, Xilinx ISE, ModelSim, Xilinx Vivado</li><li><b>Development Boards:</b> Arduino, Raspberry Pi, STM32, Wi-Fi and Bluetooth SoC</li></ul><h2>Contact</h2><p><a href="mailto:sayantanpanda123@gmail.com">sayantanpanda123@gmail.com</a></p><ul><li><a href="https://www.linkedin.com/in/sayantan-panda/">LinkedIn</a></li><li><a href="https://github.com/Sayantan001">GitHub</a></li><li><a href="https://orcid.org/0009-0006-4051-6273">ORCID</a></li><li><a href="https://www.scopus.com/authid/detail.uri?authorId=58834830400">Scopus</a></li><li><a href="https://scholar.google.com/citations?user=wGkxHxUAAAAJ&amp;hl=en">Google Scholar</a></li><li><a href="https://www.instagram.com/sayantan__panda?knvt=bG1jamo1aWFiM3Y4&utm_source=qr">Instagram</a></li></ul></main></noscript>

 {f:"Our work proposes a prototype robotic system for rapid patient registration, continuous monitoring of critical vital signs and better patient engagement through an AI chatbot. Sensors measure heart rate, SpO2 and temperature, a touch-screen display on a Raspberry Pi handles registration, and a Python chatbot answers common questions and guides patients. A SIM800L GSM module calls or texts a doctor in an emergency, and vital-sign data is synced to Firebase so doctors can review it in a mobile app before the consultation.\nThe robot has a 3D-printed head with animated TFT eyes, two 4-DOF arms, a sensor plate and a mobile base. Its navigation was developed in ROS 2 with Gazebo, Cartographer SLAM and Nav2 in a simulated hospital. Initial results show that patients can register themselves without a nurse, check their vital signs and get their questions answered, improving both the patient experience and hospital efficiency.\nComputing Communication and Intelligence, Taylor & Francis (CRC Press), 2026. DOI: 10.1201/9781003768654-38. ISBN: 9781041288145, 9781041292357, 9781003768654. Scopus EID: 2-s2.0-105040316885.",t:["Book chapter","Taylor & Francis","Healthcare robotics","ROS 2","Chatbot"]},
 {f:"The increase in demand for convenient and efficient charging solutions has experienced a significant upsurge due to the rapid adoption of electric vehicles (EVs). Consequently, the primary objective of this manuscript is to offer a comprehensive analysis of the development, execution, and assessment of an independent mechanical appendage specifically tailored for charging EVs. The demand for efficient and practical charging solutions is increasing as the demand for electric vehicle (EV) adoption increases. This investigation centers on the conception and engineering of a robotic arm mechanism that has been individually tailored to integrate with EVs. This robotic arm's design aimed to have autonomous capabilities, which include exact automobile identification, plug-in procedures, and real-time battery monitoring, ensure the charging process's security and efficacy. This study aims to give a complete examination of the modelling and simulation development of arm and evaluation of YOLOv8 based charging port detection exclusively for EV charging applications. The proposed model is capable of classifying charging ports precisely. The CCS1 metrics are: 100% recall, 0.962 mAP50; Type 1 – 100% recall, 0.993 mAP50; CHAdeMO – 82.6% recall; GB-T – 92.3% recall; Tesla – 100% recall; Type 2 ports – 94.1% recall. The research comprises the design of and engineering of a robotic arm system that is optimized to interface with EVs intuitively.\nThe six-axis arm has a payload of 0.5 to 2.6 kg with 750 mm horizontal and 1350 mm vertical reach. Structural steel and aluminium alloy links were compared with ANSYS finite element analysis, and joint torques were checked with multi-body dynamics and hand calculations.\nThe arm runs on ROS 2 with a URDF model, MoveIt and KDL inverse kinematics, tested in RViz2 and Gazebo. A YOLOv8 model (168 layers, 11.1 million parameters, trained on a Tesla T4 GPU) detects seven charging port classes: CCS1, CCS2, CHAdeMO, GB/T, Tesla, Type 1 and Type 2.\nA hardware prototype was built from aluminium channels and 3D-printed parts, with four NEMA 17 motors and one NEMA 23 stepper for the base, DM542E drivers, and an Arduino talking to ROS 2 Humble over UART at 115200 baud. Ultrasonic sensors slow the arm within 25 cm of an obstacle and stop it within 10 cm.\nMy contribution (CRediT): Resources, Methodology, Investigation. Published open access in Results in Engineering, Elsevier. DOI: 10.1016/j.rineng.2025.105438",t:["Elsevier","6-DOF arm","YOLOv8","ROS 2","MoveIt","ANSYS FEA"]},
 {f:"Insufficient automation in EV charging demands precise navigation and charging port detection for the optimal operation of Automatic Charging Robots. This study presents AViTRoN, Advanced Vision Track Routing and Navigation system, which employs YOLOv8 for real-time charging port detection, complemented by a 3D camera for accurate navigation of the ACR and a notification system for charging completion via GSM/GPRS, enhancing user experience.",t:["IEEE","YOLOv8","3D camera","EV charging"]},
 {f:"Aquaculture is expanding to meet global fish demand but faces environmental challenges. To address this, an economical remote-surveillance system for marine net-pens has been developed using GSM, GPS, IoT, and embedded systems. This system remotely monitors seawater parameters like temperature, turbidity, dissolved oxygen, and pH, reducing the need for manual inspections. Data from intelligent water sensors is transmitted via GPRS and GSM to centralized servers for real-time analysis. However, sustainability remains a concern, as fishmeal from wild-caught fish, essential for aquaculture feed, impacts marine ecosystems. This project aims to enhance efficiency while addressing environmental challenges.",t:["Springer","IoT","GPRS","GPS","Embedded systems"]},
 {f:"Osteoarthritis is a chronic, progressive condition characterized by the deterioration of joint cartilage, leading to pain and stiffness, particularly in weight-bearing joints. Knee osteoarthritis is widespread among older individuals, and does not have a single medication that is universally acknowledged as effective for its treatment. Early identification and treatment are essential to mitigate morbidity and surgical costs, and the existing clinical criteria are only partially effective.\nThe study's findings indicate that the developed method effectively synchronizes a sensor system using IMU sensor data to analyze individual gait patterns. By placing sensors on the femur and tibia, Roll, Pitch, and Yaw values were obtained. Alerts are programmed to signal deviations beyond the healthy thresholding range. The study suggests the potential of IMU sensors in predicting knee flexion angles during daily activities.",t:["Springer","IMU sensors","Gait analysis","Knee osteoarthritis"]},
 {f:"Artificial intelligence (AI) is rapidly transforming healthcare, leading to the creation of novel applications. Intelligent chatbots, in particular, hold immense potential for improving patient interaction and optimizing initial diagnosis. This paper presents an AI-powered healthcare chatbot designed to offer accessible, timely, and evidence-based guidance to patients experiencing a diverse range of symptoms. The chatbot addresses fundamental health inquiries and improves the efficiency of healthcare delivery by optimizing the initial point of patient contact. The primary objective is to enhance diagnostic sensitivity and promote patient self-management while building user trust. This research represents a significant stride towards a more integrated and responsive digital healthcare solution.",t:["IEEE","AI","Healthcare","Chatbot"]}]};

const yawG=new THREE.Group();yawG.position.y=.4;sb.add(yawG);add(yawG,C_(.7,.8,.9),mid,0,.5,0);add(yawG,B(.5,.5,.9),dark,0,.8,0);
const shG=new THREE.Group();shG.position.y=1;yawG.add(shG);
add(shG,C_(.32,.32,1.1),mg).rotation.z=Math.PI/2;add(shG,B(.5,L1,.5),mid,0,L1/2,0);add(shG,B(.1,L1*.8,.52),cy,0,L1/2,0);
const elG=new THREE.Group();elG.position.y=L1;shG.add(elG);add(elG,SP(.36),mg);
const j4=new THREE.Group();elG.add(j4);add(j4,B(.4,L2,.4),dark,0,L2/2,0);add(j4,B(.1,L2*.7,.42),cy,0,L2/2,0);
const wrG=new THREE.Group();wrG.position.y=L2;j4.add(wrG);add(wrG,SP(.27),mg);
const toolG=new THREE.Group();wrG.add(toolG);add(toolG,C_(.2,.2,.3),mid,0,.2,0);add(toolG,C_(.22,.22,.05),am,0,.36,0);
const fL=add(toolG,B(.06,.38,.14),am,.1,.55,0),fR=add(toolG,B(.06,.38,.14),am,-.1,.55,0);
const tgtM=add(sb,SP(.14),mg,0,3,0);tgtM.add(new THREE.Mesh(new THREE.RingGeometry(.3,.36,32),new THREE.MeshBasicMaterial({color:0xff3fd2,side:2})));
const ik={yaw:0,s:0,e:0,w:Math.PI,r4:0,r6:0},ms=new THREE.Vector2(),ray=new THREE.Raycaster(),pl=new THREE.Plane(),tp=new THREE.Vector3(0,3,0),dir=new THREE.Vector3(),clk=new THREE.Clock();let lastMove=-99,cur=-1,vis=true;
addEventListener("pointermove",e=>{const r=st.getBoundingClientRect();ms.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);lastMove=clk.elapsedTime});
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function arm(t,dt){
 if(cur===1&&t-lastMove<5){ray.setFromCamera(ms,cam);cam.getWorldDirection(dir);pl.setFromNormalAndCoplanarPoint(dir,new THREE.Vector3(0,2.6,0));const h=ray.ray.intersectPlane(pl,new THREE.Vector3());if(h)tp.lerp(h,Math.min(1,dt*10))}
 else{tp.x+=(Math.sin(t*.7)*2.6-tp.x)*dt*2;tp.y+=(2.6+Math.sin(t*1.1)*1.2-tp.y)*dt*2;tp.z+=(Math.cos(t*.7)*2.2-tp.z)*dt*2}
 tp.y=Math.max(tp.y,.5);tgtM.position.copy(tp);tgtM.children[0].lookAt(cam.position);
 const wx=tp.x,wz=tp.z,wy=tp.y+TOOL-SH-.4;let r=Math.hypot(wx,wz),h=wy,d=Math.hypot(r,h)||.01;const dc=Math.min(Math.max(d,1.1),L1+L2-.05);r*=dc/d;h*=dc/d;
 const t2=Math.acos(Math.min(1,Math.max(-1,(dc*dc-L1*L1-L2*L2)/(2*L1*L2)))),t1=Math.atan2(r,h)-Math.atan2(L2*Math.sin(t2),L1+L2*Math.cos(t2));
 const k=Math.min(1,dt*7);ik.yaw+=wrap(Math.atan2(wx,wz)-ik.yaw)*k;ik.s+=(t1-ik.s)*k;ik.e+=(t2-ik.e)*k;ik.w=Math.PI-ik.s-ik.e;ik.r4=.12*Math.sin(t*.9);ik.r6+=dt*2.2;
 yawG.rotation.y=ik.yaw;shG.rotation.x=ik.s;elG.rotation.x=ik.e;j4.rotation.y=ik.r4;wrG.rotation.x=ik.w;toolG.rotation.y=ik.r6;
 const g=.14+.07*Math.sin(t*3);fL.position.x=g;fR.position.x=-g}

/* quadcopter */
const sd=station(26,7.5,0xffb23e),drone=new THREE.Group();sd.add(drone);
add(drone,B(1.1,.26,1.1),dark);add(drone,SP(.42),mid,0,.12,0).scale.set(1,.5,1);add(drone,B(.9,.05,.9),cy,0,-.14,0);
add(drone,SP(.08),M(0x200000,0xff2020),0,0,-.6);add(drone,SP(.08),M(0x002010,0x20ff70),0,0,.6);
const rotors=[];for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2,ax=Math.cos(a)*1.35,az=Math.sin(a)*1.35;
 add(drone,B(1.5,.08,.12),dark,ax/2,0,az/2).rotation.y=-a;add(drone,C_(.16,.16,.22),mid,ax,.1,az);
 const r=new THREE.Group();r.position.set(ax,.26,az);drone.add(r);add(r,B(1.55,.02,.14),mid);
 const disc=add(r,C_(.78,.78,.01,36),cy);disc.material=new THREE.MeshBasicMaterial({color:0x19f0ff,transparent:true,opacity:.1,depthWrite:false});add(r,C_(.05,.05,.1),am);r.userData.d=k%2?1:-1;rotors.push(r)}
const dsh=add(sd,new THREE.CircleGeometry(1.4,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.5}));dsh.rotation.x=-Math.PI/2;dsh.position.y=.03;
const dPrev=new THREE.Vector3(),dVel=new THREE.Vector3();let dp=0,dr=0,dRpm=0;
const pd=new THREE.Plane(new THREE.Vector3(0,1,0),-3.6),pdv=new THREE.Vector3();let dX=0,dZ=0;
function quad(t,dt){let gx=Math.sin(t*.5)*4,gz=Math.sin(t)*2;
 if(cur===2&&t-lastMove<4){ray.setFromCamera(ms,cam);if(ray.ray.intersectPlane(pd,pdv)){gx=Math.max(-6.5,Math.min(6.5,pdv.x-26));gz=Math.max(-6.5,Math.min(6.5,pdv.z))}}
 dX+=(gx-dX)*Math.min(1,dt*2.2);dZ+=(gz-dZ)*Math.min(1,dt*2.2);const x=dX,z=dZ,y=3.6+Math.sin(t*1.7)*.22+Math.sin(t*.63)*.1;
 dVel.set((x-dPrev.x)/dt,(y-dPrev.y)/dt,(z-dPrev.z)/dt);dPrev.set(x,y,z);drone.position.set(x,y,z);
 dp+=(dVel.z*.05-dp)*.1;dr+=(-dVel.x*.05-dr)*.1;drone.rotation.set(dp,t*.15,dr,"YXZ");
 dRpm=5200+Math.sin(t*1.7)*180;rotors.forEach(r=>r.rotation.y+=r.userData.d*dt*34);
 dsh.position.set(x,.03,z);dsh.scale.setScalar(.8+y*.08);dsh.material.opacity=.55-y*.06}

/* telemetry + camera views */
const f=(n,d=2,w=7)=>n.toFixed(d).padStart(w),dg=r=>r*57.2958;let fps=60,lastTele=0;
function tele(t){let s;
 if(cur<=0)s=`<b>AGV-01</b> | 2D LIDAR\npose  x${f(agv.position.x)} z${f(agv.position.z)} m\nyaw   ${f(((dg(agv.rotation.y)%360)+360)%360,1)} deg\nspeed ${f(agvV)} m/s\nbeams ${RN}, range ${RANGE} m\nhits  ${String(hitCount).padStart(3)} nearest ${f(minR)} m\ntip   click the floor to drive`;
 else if(cur===1)s=`<b>ARM-06</b> | 6-DOF IK\nJ1 ${f(dg(ik.yaw),1)} deg\nJ2 ${f(dg(ik.s),1)} deg\nJ3 ${f(dg(ik.e),1)} deg\nJ5 ${f(dg(ik.w),1)} deg\nJ6 ${f(dg(ik.r6%6.2832),1)} deg`;
 else s=`<b>UAV-03</b> | quadcopter\nalt   ${f(drone.position.y)} m\npitch ${f(dg(drone.rotation.x),1)} deg\nroll  ${f(dg(drone.rotation.z),1)} deg\nrotor ${f(dRpm,0,6)} rpm`;
 $("#tx").innerHTML=s+`\n<span style="color:#6f8c96">simulated | ${fps.toFixed(0)} fps</span>`}
const VW=[{k:"Mobile robot",c:[-12,9,14],t:[-26,.6,0]},{k:"Robotic arm",c:[6.5,5.5,9],t:[0,2.4,0]},{k:"Quadcopter",c:[34,6.5,10],t:[26,3.4,0]}];
function go(i){if(i===cur)return;const first=cur<0,v=VW[i];cur=i;[...$("#sw").children].forEach((b,k)=>b.classList.toggle("on",k===i));
 gsap.killTweensOf([cam.position,ctl.target]);const o={duration:first?3:2.1,ease:"power3.inOut"};
 gsap.to(cam.position,{x:v.c[0],y:v.c[1],z:v.c[2],...o});gsap.to(ctl.target,{x:v.t[0],y:v.t[1],z:v.t[2],...o})}
VW.forEach((v,i)=>{const b=document.createElement("button");b.className="bt";b.textContent=v.k;b.title=`Key ${i+1}`;b.onclick=()=>go(i);$("#sw").appendChild(b)});
addEventListener("keydown",e=>{const n=+e.key;if(vis&&n>=1&&n<=3)go(n-1)});
function rs(){const w=st.clientWidth,h=st.clientHeight;ren.setSize(w,h);cam.aspect=w/h;if(w>820)cam.setViewOffset(w,h,-w*.2,0,w,h);else cam.clearViewOffset();cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();
new IntersectionObserver(e=>{vis=e[0].isIntersecting},{threshold:.05}).observe($("#home"));
function loop(){const dt=Math.min(clk.getDelta(),.05)||.016,t=clk.elapsedTime;requestAnimationFrame(loop);if(!vis)return;
 fps+=(1/dt-fps)*.05;agvStep(dt);
 lid.rotation.y=t*6;wheels.forEach(w=>w.rotation.x+=dt*agvV/.34);scan();arm(t,dt);quad(t,dt);
 if(t-lastTele>.12){lastTele=t;tele(t)}ctl.update();ren.render(scene,cam)}
/* mobile-robot view: click the floor and the AGV plans a route around the pillars and drives there */
{let dn=null;const rc=new THREE.Raycaster(),m2=new THREE.Vector2(),fl=new THREE.Plane(new THREE.Vector3(0,1,0),0),hv=new THREE.Vector3();
 ren.domElement.addEventListener("pointerdown",e=>{dn=[e.clientX,e.clientY]});
 ren.domElement.addEventListener("pointerup",e=>{if(!dn||cur!==0)return;const mv=Math.hypot(e.clientX-dn[0],e.clientY-dn[1]);dn=null;if(mv>6)return;
  const r=st.getBoundingClientRect();m2.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(m2,cam);
  if(!rc.ray.intersectPlane(fl,hv))return;const gx=hv.x-sa.position.x,gz=hv.z;
  if(Math.hypot(gx,gz)>ARENA-1.2||OB.some(([ox,oz,r2])=>Math.hypot(gx-ox,gz-oz)<r2+1.0))return;
  const p=plan(agv.position.x,agv.position.z,gx,gz);if(!p)return;agvMode="go";agvHold=1.2;setPath(p);goalM.position.set(gx,.05,gz);goalM.visible=true})}
loop();setTimeout(()=>go(0),400);
})();
